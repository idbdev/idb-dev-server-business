transformation:
  - isDynamic: true
    alias: Transform
    description: Transforming RND Pipeline And Biologics Research
    sequence: 4
    inputDataFrameList:
      - inputDataFrame: Rnd_Pipeline_1
        tempViewName: RND_PIPELINE
      - inputDataFrame: Translation_Research_1
        tempViewName: TRANSLATIONAL_RESEARCH
      - inputDataFrame: Ind_Filings_1
        tempViewName: IND_FILINGS
    query: SELECT rp.PROGRAM_ID, rp.PROGRAM_NAME, rp.PRODUCT_NAME, rp.MOLECULE_TYPE,
      rp.THERAPEUTIC_AREA, rp.INDICATION, rp.PHASE, rp.STATUS AS PROGRAM_STATUS,
      rp.START_DATE, rp.EXPECTED_COMPLETION, rp.BUDGET_USD,
      rp.SPEND_TO_DATE_USD, ROUND( CASE WHEN rp.BUDGET_USD = 0 THEN NULL ELSE
      (rp.SPEND_TO_DATE_USD * 100.0) / rp.BUDGET_USD END, 2 ) AS
      BUDGET_UTILIZATION_PCT, rp.PRINCIPAL_INVESTIGATOR, rp.PARTNERSHIP,
      ind.FILING_ID, ind.FILING_TYPE, ind.STATUS AS IND_STATUS,
      ind.CLINICAL_HOLD, tr.RESEARCH_ID, tr.ASSAY_TYPE, tr.TARGET_NAME,
      tr.BIOMARKER, tr.RESULT_VALUE, tr.RESULT_UNIT, tr.STATUS AS
      RESEARCH_STATUS FROM RND_PIPELINE rp LEFT JOIN IND_FILINGS ind ON
      rp.PROGRAM_ID = ind.PROGRAM_ID LEFT JOIN TRANSLATIONAL_RESEARCH tr ON
      rp.PROGRAM_ID = tr.PROGRAM_ID
    optional:
      persistDataFrame: false
      loggingOptions:
        printSchema: true
    type: operationThroughSqlQuery
controlPort:
  dataQualityRules:
    NullValueCheck:
      productState:
        checks:
          - column: BUDGET_USD
          - column: PROGRAM_STATUS
          - column: PRODUCT_NAME
        referenceAlias: loading_RND_Pipeline_And_Biologics_Research_data_in_iceberg
    NullCombinationCheck:
      productState:
        checks:
          - columns:
              - BUDGET_UTILIZATION_PCT
            expression: <=
            number: 25
        referenceAlias: loading_RND_Pipeline_And_Biologics_Research_data_in_iceberg
    UniquenessCheck:
      productState:
        checks:
          - column: PROGRAM_ID
        referenceAlias: loading_RND_Pipeline_And_Biologics_Research_data_in_iceberg
    UnacceptableTextValueCheck:
      productState:
        checks:
          - column: PROGRAM_ID
            valueList:
              - xyz
            expression: ">"
            number: 0
          - column: PROGRAM_NAME
            valueList:
              - zcx
            expression: ">"
            number: 0
        referenceAlias: loading_RND_Pipeline_And_Biologics_Research_data_in_iceberg
