jobId: "992"
jobName: User Master - Iceberg to Iceberg
jobType: Source Aligned Data Product
developerId: e57fd089-0c45-4273-8d8d-92f488de08b7
domain: business
alias: load_all_columns_in_iceberg
discoveryPort:
  name: User Master - Iceberg to Iceberg
inputPorts:
  - alias: User_-_Iceberg_1
    isDynamic: true
    path: s3a://dataverse/dummy-data/data_1.csv
    optional:
      persistDataFrame: false
      advanceOptions:
        delimiter: ","
      enableDataReconciliation: false
      enforceSchema: false
      connection: S3 Connection
      dataSetUrn: urn:dv:dataset:c5d39982-f0c0-494f-845b-de70d026c29b
      dataQualityCheck:
        tableId: 1
        enable: true
        RecordCountCheck:
          expression: ">="
          number: 20000
      loggingOptions:
        printSchema: true
        count: true
        showData: true
    type: inputDelimited
productState:
  isDynamic: true
  alias: load_all_columns_in_iceberg
  retentionVersions: ""
  logicalSchema:
    properties:
      Name:
        type: STRING
        description: Name of the user
        sourceColumn: Name
        sourceTable: public.data_1
      Age:
        type: STRING
        description: Age of the user
        sourceColumn: Age
        sourceTable: public.data_1
      City:
        type: STRING
        description: Location of the user
        sourceColumn: City
        sourceTable: public.data_1
      Occupation:
        type: STRING
        description: Profession of the user
        sourceColumn: Occupation
        sourceTable: public.data_1
  stateStoreType: loadDataIceberg
  isProfilingEnabled: true
  updateStrategy: Overwrite
  tableName: iceberg_meta.user_master_on_iceberg
  warehousePath: s3a://dataverse/dev_server/iceberg_warehouse_testing/
  catalogName: postgres_catalog
  optional:
    persistDataFrame: false
    enableDataReconciliation: false
    enforceSchema: true
    enforceSchemaMethod: Warning
    catalogType: postgres
    loggingOptions:
      printSchema: true
      count: true
  refreshInterval: 30 12 * * *
transformation:
  - isDynamic: true
    alias: Spark_SQL_1
    description: select all columns
    sequence: 2
    inputDataFrameList:
      - inputDataFrame: User_-_Iceberg_1
        tempViewName: user
    query: select * from user
    optional:
      persistDataFrame: false
      loggingOptions:
        printSchema: true
        count: true
        showData: true
    type: operationThroughSqlQuery
controlPort:
  dataQualityRules:
    UnacceptableTextValueCheck:
      productState:
        checks:
          - column: Age
            valueList:
              - "30"
              - "40"
            expression: ==
        referenceAlias: load_all_columns_in_iceberg
    RecordCountCheck:
      inputPort:
        - expression: ">="
          number: 20000
          referenceAlias: User_-_Iceberg_1
