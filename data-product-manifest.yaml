jobId: "991"
jobName: kafka v2
jobType: Source Aligned Data Product
jobSubType: streaming
developerId: e57fd089-0c45-4273-8d8d-92f488de08b7
domain: business
alias: loading_in_iceberg_for_kafka
discoveryPort:
  name: kafka v2
inputPorts: []
streamingInputPorts:
  - alias: kafka_ds_1
    isDynamic: true
    connection: kafka conn
    topics:
      - test-topic
    schema:
      - columnName: name
        dataType: String
        nullable: true
      - columnName: age
        dataType: Integer
        nullable: true
    optional:
      advanceOptions:
        failOnDataLoss: true
    type: kafkaStream
    sequence: 1
productState:
  isDynamic: true
  alias: loading_in_iceberg_for_kafka
  retentionVersions: ""
  logicalSchema:
    properties:
      name:
        type: STRING
        description: Name of the user
        sourceColumn: Name
        sourceTable: public.data_1
      age:
        type: STRING
        description: Age of the user
        sourceColumn: Age
        sourceTable: public.data_1
  stateStoreType: loadDataIceberg
  isProfilingEnabled: true
  updateStrategy: Overwrite
  tableName: iceberg_meta.kafkav2
  warehousePath: s3a://dataverse/dev_server/iceberg_warehouse_testing/
  catalogName: postgres_catalog
  optional:
    persistDataFrame: false
    enableDataReconciliation: false
    enforceSchema: false
    enforceSchemaMethod: Warning
    catalogType: postgres
    connection: S3 conn
    loggingOptions:
      printSchema: true
      count: true
      showData: true
  refreshInterval: None
transformation:
  - isDynamic: true
    alias: Spark_SQL_1
    description: transforming kafka v2
    sequence: 2
    inputDataFrameList:
      - inputDataFrame: kafka_ds_1
        tempViewName: tmp
    query: select * from tmp
    optional:
      persistDataFrame: false
    type: operationThroughSqlQuery
controlPort:
  dataQualityRules:
    NullValueCheck:
      productState:
        checks:
          - column: name
        referenceAlias: loading_in_iceberg_for_kafka
    UniquenessCheck:
      productState:
        checks:
          - column: name
        referenceAlias: loading_in_iceberg_for_kafka
