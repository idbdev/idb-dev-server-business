transformation:
  - isDynamic: true
    alias: Transformation
    description: Transform Data of WCL Source To Target Mapping
    sequence: 3
    inputDataFrameList:
      - inputDataFrame: Target_Sales_1
        tempViewName: target
      - inputDataFrame: Actual_Sales_1
        tempViewName: sales
    query: SELECT 'SALES' AS RECORD_TYPE, CUSTOMER_ID, ITEM_ID, RECID, SALES_ID,
      INVOICE_ID, INVOICE_DATE AS TRANSACTION_DATE, INVOICED_QTY, UOM,
      DELIVERY_MODE, INVENT_LOCATION_ID, BILLING_PRICE, DUE_DATE,
      INVOICE_AMOUNT, INVOICE_VOUCHER, SALES_UNIT, SITE_ID, DATA_AREA_ID,
      DELIVERY_TERM, INVOICE_STATUS, SALES_PRICE, DISC_AMT, MRP,
      WMS_LOCATION_ID, ADDRESS_REC_ID, SALES_GROUP, ENTRY_DATE, PACKING_UNIT,
      SALES_TYPE, CUST_INVOICE_TRANS_REC_ID, CUST_INVOICE_TRANS_TABLE_ID,
      SALES_CHANNEL, SHIPMENT_VOUCHER_TYPE, PRICE_GROUP_ID, EWBILL_EXPIRY_DATE,
      EWBILL_GENERATED_DATE, EWBILL_NO, EWBILL_STATUS, ASSESEABLE_AMT, MBP,
      GROSS_AMT, FREIGHT_PASS_STATUS, FREIGHT_LIABILITY_STATUS,
      FREIGHT_LIABILITY_JOURNAL, FREIGHT_LIABILITY_VOUCHER,
      FREIGHT_PASSING_JOURNAL, FREIGHT_PASSING_VOUCHER, LINE_DISC_REMARK,
      TRAILER_DISCOUNT, FREIGHT_LIABILITY_DATE, FREIGHT_LIABILITY_AMT,
      FREIGHT_PASSING_DATE, FREIGHT_PASSING_AMT, CANCELLED_SALES_ID,
      CANCELLED_INVOICE_VOUCHER, TO_DP_CODE, VALIDITY_DATE, PAYABLE_STATE,
      RECOVERABLE_STATE, FLAG_VOUCHER_CANCELLED, IS_CANCELLED,
      INVOICE_DATE_TIME, SALES_ROAD_QTY, SALES_RAIL_QTY, EPOD_COMPLETION_DATE,
      EPOD_STATUS, JOURNAL_NO, TRANSPORTER_BILL_NO, TRANSPORTER_BILL_DATE,
