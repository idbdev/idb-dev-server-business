transformation:
  - isDynamic: true
    alias: Transform
    description: Transforming Global Supply Chain And Manufacturing Quality
    sequence: 4
    inputDataFrameList:
      - inputDataFrame: Quality_Events_1
        tempViewName: QUALITY_EVENTS
      - inputDataFrame: Batch_Records_1
        tempViewName: BATCH_RECORDS
      - inputDataFrame: Equipment_Oee_1
        tempViewName: EQUIPMENT_OEE
    query: SELECT br.BATCH_ID, br.PRODUCT_NAME, br.MANUFACTURING_SITE,
      br.BATCH_SIZE, br.BATCH_SIZE_UOM, br.START_DATE AS BATCH_START,
      br.END_DATE AS BATCH_END, br.YIELD_PERCENT, br.STATUS AS BATCH_STATUS,
      br.GMP_COMPLIANT, br.DEVIATION_COUNT, br.RELEASE_DATE, br.EXPIRY_DATE,
      eo.EQUIPMENT_ID, eo.EQUIPMENT_NAME, eo.MEASUREMENT_DATE,
      eo.AVAILABILITY_PERCENT, eo.PERFORMANCE_PERCENT, eo.QUALITY_PERCENT,
      eo.OEE_PERCENT, eo.DOWNTIME_HOURS, eo.MAINTENANCE_TYPE, qe.EVENT_ID AS
      QUALITY_EVENT_ID, qe.EVENT_TYPE AS QUALITY_EVENT_TYPE, qe.SEVERITY AS
      QUALITY_EVENT_SEVERITY, qe.STATUS AS QUALITY_EVENT_STATUS, qe.ROOT_CAUSE,
      qe.CAPA_ID FROM BATCH_RECORDS br LEFT JOIN EQUIPMENT_OEE eo ON
      br.MANUFACTURING_SITE = eo.MANUFACTURING_SITE LEFT JOIN QUALITY_EVENTS qe
      ON br.BATCH_ID = qe.BATCH_ID
    optional:
      persistDataFrame: false
      loggingOptions:
        printSchema: true
    type: operationThroughSqlQuery
controlPort:
  dataQualityRules:
    NullValueCheck:
      productState:
        checks:
          - column: YIELD_PERCENT
          - column: BATCH_STATUS
        referenceAlias: loading_Global_Supply_Chain_And_Manufacturing_Quality_Data_in_iceberg
    NullCombinationCheck:
      productState:
        checks:
          - columns:
              - YIELD_PERCENT
            expression: <=
            number: 25
        referenceAlias: loading_Global_Supply_Chain_And_Manufacturing_Quality_Data_in_iceberg
    UniquenessCheck:
      productState:
        checks:
          - column: BATCH_ID
        referenceAlias: loading_Global_Supply_Chain_And_Manufacturing_Quality_Data_in_iceberg
